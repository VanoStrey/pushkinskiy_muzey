[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "openai==3.22.1",
    "uvicorn[standard]==0.53.0",
    "ydb==3.32.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
